name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Instalar dependencias
      run: npm ci

    - name: Ejecutar Linter (Análisis de codigo estático)
      run: npm run lint --if-present

    - name: Ejecutar Pruebas Unitarias y de Integracion
      run: npm test

    - name: Construir imagen Docker
      run: docker build -t my-devops-app:${{ github.sha }} .
      
    - name: Iniciar sesión en GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Construir y Desplegar Imagen a GitHub Packages
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/devops-webapp:latest
          ghcr.io/${{ github.repository_owner }}/devops-webapp:${{ github.sha }}

    - name: Escaneo de vulnerabilidades en contenedor (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ github.repository_owner }}/devops-webapp:latest'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
